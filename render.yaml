# Render Blueprint — sobe API + Dashboard num único deploy.
services:
  - type: web
    name: deepsearch-soc-prod-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/db db:bootstrap && pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NVD_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: SCAN_DAYS
        value: "3"
      - key: NVD_RESULTS_PER_TECH
        value: "10"
      - key: SCAN_TECH_CONCURRENCY
        value: "4"
      - key: REDHAT_JFPE_TO
        sync: false
      - key: REDHAT_TRF5_TO
        sync: false
      - key: REDHAT_REPORT_CC
        sync: false
      - key: MICROSOFT_REPORT_TO
        sync: false
      - key: MICROSOFT_REPORT_CC
        sync: false

  - type: web
    name: deepsearch-soc-prod-web
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/cve-dashboard build
    staticPublishPath: ./artifacts/cve-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false